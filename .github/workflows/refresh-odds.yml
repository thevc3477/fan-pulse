name: Refresh Kalshi Odds

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh live Kalshi odds and rebuild static site
        run: python3 scripts/refresh_kalshi.py
      - name: Commit updated snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json index.html web/index.html
          git diff --staged --quiet || (git commit -m "Refresh live Kalshi odds snapshot" && git push)
